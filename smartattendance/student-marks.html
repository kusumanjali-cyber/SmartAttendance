<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Attendance - My Marks</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eef5fc;
            color: #173f70;
        }

        .navbar {
            height: 68px;
            background: linear-gradient(90deg, #063b78, #0758a8);
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 45px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 18px;
            font-weight: bold;
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            background: white;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .back-btn {
            color: white;
            text-decoration: none;

            border: 1px solid rgba(255,255,255,.7);

            padding: 9px 17px;

            border-radius: 5px;

            font-size: 13px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: white;
            color: #0758a8;
        }

        .container {
            max-width: 1050px;
            margin: auto;
            padding: 38px 25px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            color: #063b78;
            font-size: 29px;
            margin-bottom: 7px;
        }

        .heading p {
            color: #6b84a0;
            font-size: 14px;
        }

        .student-card {
            background: white;
            border-radius: 10px;
            padding: 22px 25px;

            box-shadow: 0 7px 25px rgba(20,70,120,.08);

            display: flex;
            align-items: center;
            gap: 16px;

            margin-bottom: 25px;
        }

        .student-icon {
            width: 55px;
            height: 55px;

            background: #e8f2ff;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
        }

        .student-card h2 {
            color: #073b78;
            font-size: 19px;
            margin-bottom: 5px;
        }

        .student-card p {
            color: #7187a0;
            font-size: 12px;
        }

        .marks-card {
            background: white;
            border-radius: 10px;

            padding: 28px;

            box-shadow: 0 7px 25px rgba(20,70,120,.08);
        }

        .marks-card h2 {
            color: #073b78;
            font-size: 19px;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #edf5fd;
            color: #315a7e;

            text-align: left;
            padding: 14px;
        }

        td {
            padding: 14px;

            border-bottom: 1px solid #edf1f5;

            color: #617b94;
        }

        .subject {
            color: #174f86;
            font-weight: bold;
        }

        .marks {
            color: #063b78;
            font-weight: bold;
        }

        .pass {
            color: #16824d;
            font-weight: bold;
        }

        .fail {
            color: #c0392b;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #8296aa;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #7187a0;
        }

        .refresh-btn {
            border: none;
            background: #0872dc;
            color: white;

            padding: 10px 18px;

            border-radius: 5px;

            font-size: 12px;
            font-weight: bold;

            cursor: pointer;

            float: right;
        }

        .refresh-btn:hover {
            background: #075db5;
        }

        .card-title {
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-title h2 {
            float: left;
            margin-bottom: 0;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 18px;
            }

            .logo {
                font-size: 14px;
            }

            .container {
                padding: 25px 15px;
            }

            .student-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        <div class="logo-icon">🎓</div>
        <span>Smart Attendance System</span>
    </div>

    <a href="student.html" class="back-btn">
        ← Dashboard
    </a>

</header>


<main class="container">

    <div class="heading">

        <h1>My Marks</h1>

        <p>
            View your marks and academic performance.
        </p>

    </div>


    <!-- STUDENT INFORMATION -->

    <div class="student-card">

        <div class="student-icon">
            👨‍🎓
        </div>

        <div>

            <h2 id="studentName">
                Student
            </h2>

            <p>
                Your examination marks
            </p>

        </div>

    </div>


    <!-- MARKS -->

    <div class="marks-card">

        <div class="card-title">

            <h2>
                Marks Details
            </h2>

            <button
                class="refresh-btn"
                onclick="loadMarks()"
            >
                Refresh
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Subject</th>
                        <th>Exam</th>
                        <th>Marks</th>
                        <th>Status</th>
                    </tr>

                </thead>


                <tbody id="marksTable">

                    <tr>

                        <td
                            colspan="4"
                            class="loading"
                        >
                            Loading marks...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<script>

    /*
     * Student name from current login session.
     */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const savedName =
                sessionStorage.getItem("studentName");

            if (savedName) {

                document.getElementById(
                    "studentName"
                ).textContent = savedName;

            }

            loadMarks();

        }
    );


    async function loadMarks() {

        const table =
            document.getElementById("marksTable");


        table.innerHTML = `
            <tr>
                <td colspan="4" class="loading">
                    Loading marks...
                </td>
            </tr>
        `;


        try {

            /*
             * Use the existing marks servlet
             * if available in the project.
             */

            const response =
                await fetch("StudentMarksServlet");


            if (!response.ok) {

                throw new Error(
                    "Marks service unavailable"
                );

            }


            const data =
                await response.json();


            if (!data.success) {

                table.innerHTML = `
                    <tr>
                        <td colspan="4" class="empty">
                            ${escapeHtml(
                                data.message ||
                                "No marks available."
                            )}
                        </td>
                    </tr>
                `;

                return;
            }


            const marks =
                data.marks || [];


            if (marks.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="4" class="empty">
                            No marks have been entered yet.
                        </td>
                    </tr>
                `;

                return;
            }


            table.innerHTML = "";


            marks.forEach(function (item) {

                const mark =
                    Number(
                        item.marks ??
                        item.mark ??
                        item.score ??
                        0
                    );


                const status =
                    mark >= 40
                        ? "Pass"
                        : "Fail";


                const statusClass =
                    mark >= 40
                        ? "pass"
                        : "fail";


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td class="subject">
                        ${escapeHtml(
                            item.subjectName ??
                            item.subject ??
                            "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.examType ??
                            item.exam ??
                            "-"
                        )}
                    </td>

                    <td class="marks">
                        ${mark}
                    </td>

                    <td class="${statusClass}">
                        ${status}
                    </td>

                `;


                table.appendChild(row);

            });


        } catch (error) {

            console.error(error);

            table.innerHTML = `
                <tr>
                    <td colspan="4" class="empty">
                        Marks service is not available yet.
                    </td>
                </tr>
            `;

        }

    }


    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent = value;

        return div.innerHTML;

    }

</script>

</body>
</html>
