<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f9ff;
            color: #123f78;
            min-height: 100vh;
        }

        nav {
            height: 58px;
            background: #063b78;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            color: white;
        }

        .logo {
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .hero {
            min-height: calc(100vh - 58px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 55px 8%;
            gap: 50px;
        }

        .hero-content {
            max-width: 500px;
        }

        .hero-content h1 {
            font-size: 43px;
            line-height: 1.12;
            color: #063b78;
            margin-bottom: 22px;
        }

        .tagline {
            font-size: 18px;
            color: #24588f;
            margin-bottom: 18px;
        }

        .description {
            font-size: 14px;
            line-height: 1.7;
            color: #5d7695;
            margin-bottom: 28px;
            max-width: 440px;
        }

        .buttons {
            display: flex;
            gap: 14px;
        }

        .btn {
            padding: 12px 23px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }

        .btn-primary {
            background: #1685ed;
            color: white;
        }

        .btn-secondary {
            background: white;
            color: #063b78;
            border: 1px solid #b8cee7;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .illustration {
            width: 430px;
            height: 330px;
            background: #eaf4ff;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cap {
            position: absolute;
            top: 55px;
            left: 95px;
            width: 220px;
            height: 70px;
            background: #0759c9;
            transform: rotate(-8deg);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .cap-base {
            position: absolute;
            top: 102px;
            left: 160px;
            width: 90px;
            height: 55px;
            background: #1478df;
            border-radius: 0 0 45px 45px;
        }

        .books {
            position: absolute;
            bottom: 45px;
            left: 70px;
            width: 150px;
        }

        .book {
            height: 18px;
            margin-top: 5px;
            border-radius: 3px;
        }

        .book.one {
            background: #176fd1;
            width: 150px;
        }

        .book.two {
            background: #4d9eea;
            width: 125px;
            margin-left: 15px;
        }

        .book.three {
            background: #8dbce8;
            width: 105px;
            margin-left: 25px;
        }

        .clock {
            position: absolute;
            right: 55px;
            bottom: 45px;
            width: 95px;
            height: 95px;
            border: 8px solid #165cae;
            background: white;
            border-radius: 50%;
        }

        .clock:before {
            content: "";
            position: absolute;
            width: 4px;
            height: 30px;
            background: #165cae;
            left: 42px;
            top: 15px;
            transform-origin: bottom;
            transform: rotate(25deg);
        }

        .clock:after {
            content: "";
            position: absolute;
            width: 28px;
            height: 4px;
            background: #165cae;
            left: 42px;
            top: 46px;
            transform-origin: left;
            transform: rotate(8deg);
        }

        .plant {
            position: absolute;
            right: 5px;
            bottom: 35px;
            font-size: 65px;
        }

        @media (max-width: 850px) {
            .hero {
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .buttons {
                justify-content: center;
            }

            .illustration {
                width: 350px;
                height: 280px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            🎓 Smart Attendance System
        </div>

        <div class="nav-links">
            <a href="login.html">Home</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <section class="hero">

        <div class="hero-content">

            <h1>
                Smart Attendance<br>
                System
            </h1>

            <p class="tagline">
                Track. Manage. Succeed.
            </p>

            <p class="description">
                A simple and efficient way to manage student
                attendance, marks, and academic progress.
            </p>

            <div class="buttons">
                <a href="register.html" class="btn btn-primary">
                    Get Started
                </a>

                <a href="login.html" class="btn btn-secondary">
                    Login
                </a>
            </div>

        </div>

        <div class="illustration">

            <div class="cap"></div>
            <div class="cap-base"></div>

            <div class="books">
                <div class="book one"></div>
                <div class="book two"></div>
                <div class="book three"></div>
            </div>

            <div class="clock"></div>

            <div class="plant">🌿</div>

        </div>

    </section>

</body>
</html>
